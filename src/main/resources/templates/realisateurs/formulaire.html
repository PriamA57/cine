<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouveau realisateur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Nouveau realisateur</h1>
<form th:action="@{/realisateurs}" th:object="${realisateur}" method="post">
    <p>Prenom : <input type="text" th:field="*{prenom}"></p>
    <p>Nom : <input type="text" th:field="*{nom}" required></p>
    <p>Nationalite : <input type="text" th:field="*{nationalite}"></p>
    <button type="submit">Enregistrer</button>
    <a th:href="@{/realisateurs}">Annuler</a>
</form>
</body>
</html>
