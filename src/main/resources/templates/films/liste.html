<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogue de films</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Catalogue de films</h1>
<p>
    <a th:href="@{/films/nouveau}">+ Ajouter un film</a> |
    <a th:href="@{/realisateurs}">Gerer les realisateurs</a>
</p>
<table>
    <tr>
        <th>Titre</th><th>Annee</th><th>Duree</th>
        <th>Genre</th><th>Realisateur</th><th>Actions</th>
    </tr>
    <tr th:each="film : ${films}">
        <td th:text="${film.titre}"></td>
        <td th:text="${film.annee}"></td>
        <td th:text="${film.duree} + ' min'"></td>
        <td th:text="${film.genre}"></td>
        <td th:text="${film.realisateur != null
                 ? film.realisateur.prenom + ' ' + film.realisateur.nom : '-'}"></td>
        <td>
            <a th:href="@{/films/{id}/editer(id=${film.id})}">Modifier</a>
            <a th:href="@{/films/{id}/supprimer(id=${film.id})}"
               onclick="return confirm('Supprimer ce film ?');">Supprimer</a>
        </td>
    </tr>
</table>
</body>
</html>
